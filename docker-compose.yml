version: '3.8'

volumes:
  pg_data:
  node_modules:

services:
  db:
    image: postgres:13.10
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: always
    ports:
      - 5432:5432

  backend:
    build: ./app/
    env_file: .env
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
    depends_on:
      - db
    ports:
      - 8000:8000
    restart: on-failure

  frontend:
    build: ./frontend/
    volumes:
      - './frontend:/app'
      - node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    ports:
      - 7070:7070
    restart: on-failure

  bot:
    build: ./bot
    env_file: .env
    ports:
        - 8080:8080
    restart: on-failure
